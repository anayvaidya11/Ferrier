[project]
name = "wyzantium-phase1"
version = "0.1.0"
description = "WyZantium Phase 1 docking experiment: wire contract package + sim harness"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wirefmt", "wyzantium_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
