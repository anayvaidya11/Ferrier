[project]
name = "wyzen-phase1"
version = "0.1.0"
description = "WyZen Phase 1 docking experiment: wire contract package + sim harness"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wirefmt", "wyzen_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
